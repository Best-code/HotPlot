<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
  </head>
  <body id="body">
   <div id="map"></div>
    <div id="search-bar"  class="absolute top-3 left-15 z-5" style="visibility: hidden;">
      <form class="form relative">  
        <button type="button" class="absolute left-2 -translate-y-1/2 top-1/2 p-1">
          <svg
            width="17"
            height="16"
            fill="none"  
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-labelledby="search"
            class="w-5 h-5 text-gray-700"
          >
            <path
              d="M7.667 12.667A5.333 5.333 0 107.667 2a5.333 5.333 0 000 10.667zM14.334 14l-2.9-2.9"
              stroke="currentColor"
              stroke-width="1.333"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </svg>
        </button>
        <input
          class="input bg-white rounded-full px-8 text-xs py-3 border-2 border-transparent focus:outline-none focus:border-red-500 placeholder-gray-400 transition-all duration-300 shadow-md"
          placeholder="Find A Town's Forecast"
          type="text"
        />
        <button type="reset" class="absolute right-3 -translate-y-1/2 top-1/2 p-1">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-gray-700"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </form>
    </div>
    <section id="top-banner0" class="top-banner">
        <div id="hotplot-logo0" class="hotplot-logo"></div>
    </section>
    <section id="layerMenu" class="layerContainer">
      <div class="layerSelectBox" id="viirs">
          <div class="layerDesc" id="viirs-desc"></div>
          <div class="layerIcon" id="viirs-icon"></div>
      </div>
      <div class="layerSelectBox" , id="wfigs">
        <div class="layerDesc" id="wfigs-desc"></div>
        <div class="layerIcon" id="wfigs-icon"></div>
      </div>
      <div class="layerSelectBox" , id="fl-conserve">
        <div class="layerDesc" id="fl-conserve-desc"></div>
        <div class="layerIcon" id="fl-conserve-icon"></div>
      </div>
    </section>
    <script src="main.js"></script>
    <a href="https://www.flaticon.com/free-icons/fire" style="z-index: -1;"  title="fire icons">Fire icons created by Vectors Market - Flaticon</a>
    <a href="https://www.flaticon.com/free-icons/satellite" title="satellite icons">Satellite icons created by mattbadal - Flaticon</a>
  </body>
</html>
